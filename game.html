<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>गेमिंग ऐप</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #app-container { background-color: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        button { background-color: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #0056b3; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div id="app-container">
        <section id="login-section">
            <h1>लॉगिन करें</h1>
            <button id="google-login">Google से लॉगिन करें</button>
        </section>
        <section id="dashboard-section" class="hidden">
            <h1>डैशबोर्ड</h1>
            <p>वॉलेट बैलेंस: <span id="wallet-balance">₹0</span></p>
            <!-- रेज़रपे का फॉर्म कोड यहाँ डालें -->
            <div id="game-zone">
                <h2>गेम ज़ोन</h2>
                <button class="play-game" data-cost="10">गेम खेलें (₹10)</button>
            </div>
        </section>
    </div>
    <script>
        let balance = 0;
        document.getElementById('google-login').addEventListener('click', () => {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
        });
        document.querySelector('.play-game').addEventListener('click', (e) => {
            const cost = parseInt(e.target.dataset.cost);
            if (balance >= cost) {
                balance -= cost;
                document.getElementById('wallet-balance').innerText = `₹${balance}`;
                const isWin = Math.random() < 0.5;
                if (isWin) {
                    balance += cost * 2;
                    document.getElementById('wallet-balance').innerText = `₹${balance}`;
                    alert('आप जीत गए!');
                } else {
                    alert('आप हार गए, फिर से कोशिश करें।');
                }
            } else {
                alert('कृपया बैलेंस जोड़ें।');
            }
        });
    </script>
</body>
</html>
