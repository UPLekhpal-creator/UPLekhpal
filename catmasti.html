<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Cat Masti • Luxury Cat</title>
<style>
:root{--bg:#eef2ff;--ink:#18213a;--muted:#6d7894;--glass:rgba(255,255,255,.78);--line:#e8eaf4;--violet:#7561f6;--pink:#ff78ae;--shadow:0 24px 70px rgba(31,41,73,.16)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;color:var(--ink);background:
radial-gradient(circle at 12% 8%,#fff 0 8%,transparent 25%),
radial-gradient(circle at 92% 15%,#d9d7ff 0 7%,transparent 26%),
linear-gradient(145deg,#f8f7ff,#e9f5ff 55%,#fff1f7)}
button{font:inherit;border:0;cursor:pointer}
.app{width:min(560px,100%);margin:auto;padding:16px 14px 28px}
.top{display:flex;align-items:center;justify-content:space-between;background:var(--glass);backdrop-filter:blur(18px);border:1px solid #fff;border-radius:24px;padding:10px 13px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;font-weight:950;letter-spacing:.2px}
.logo{width:45px;height:45px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,#161c34,#7b5cf5);box-shadow:0 10px 25px #6555d64d}
.logo svg{width:34px;height:34px}
.live{display:flex;gap:7px}.mini{background:#fff;border:1px solid var(--line);border-radius:15px;padding:9px 11px;font-weight:900;color:#44506d}
.mini.on{background:#191f38;color:#fff;border-color:#191f38}
.hero{margin-top:12px;background:var(--glass);border:1px solid #fff;border-radius:30px;padding:15px;box-shadow:var(--shadow)}
.status{display:flex;justify-content:center;min-height:30px}.bubble{background:#171d34;color:#fff;padding:9px 14px;border-radius:18px;font-weight:800;font-size:14px;box-shadow:0 8px 22px #11182722;transition:.2s}
.stage{position:relative;height:480px;margin-top:10px;border-radius:25px;overflow:hidden;background:
radial-gradient(circle at 80% 17%,#fff7c8 0 3%,transparent 3.7%),
linear-gradient(#b9ecff 0 62%,#b8e99b 62%);isolation:isolate}
.stage:before{content:"";position:absolute;inset:auto 0 0;height:150px;background:linear-gradient(0deg,#8fd57d,transparent);z-index:-1}
.cloud{position:absolute;width:85px;height:25px;border-radius:30px;background:#fff9;filter:blur(1px);top:50px;left:28px}
.cloud:after{content:"";position:absolute;width:35px;height:35px;border-radius:50%;background:#fff9;left:22px;top:-15px}
.sun{position:absolute;right:34px;top:30px;font-size:48px;filter:drop-shadow(0 8px 10px #ffca4b66)}
.cat{position:absolute;left:50%;top:53%;width:310px;height:330px;transform:translate(-50%,-50%);touch-action:manipulation;filter:drop-shadow(0 25px 18px rgba(43,51,61,.24));animation:float 3.8s ease-in-out infinite}
@keyframes float{50%{transform:translate(-50%,-54%)}}
.body{position:absolute;left:62px;top:132px;width:186px;height:170px;border-radius:48% 48% 42% 42%;background:radial-gradient(circle at 32% 25%,#fff5cf 0 7%,#efb943 27%,#d7862e 72%,#9e5725);box-shadow:inset -18px -22px 26px #70361644,inset 11px 10px 16px #fff8c766}
.belly{position:absolute;left:41px;top:32px;width:104px;height:111px;border-radius:50%;background:radial-gradient(circle,#ffeab2,#f3b84d 70%);opacity:.72}
.head{position:absolute;left:48px;top:27px;width:214px;height:181px;border-radius:47% 47% 45% 45%;background:radial-gradient(circle at 32% 22%,#fff7d0 0 6%,#f4bf48 26%,#d98a30 70%,#a85e27);box-shadow:inset -18px -20px 28px #6f351d45,inset 12px 10px 18px #fff9d077}
.ear{position:absolute;top:-18px;width:80px;height:94px;background:#dc9237;clip-path:polygon(0 80%,18% 12%,50% 0,84% 16%,100% 80%,60% 58%,40% 58%);filter:drop-shadow(0 5px 2px #7b431e55)}
.ear:after{content:"";position:absolute;inset:20px 21px 25px;background:#e77d91;clip-path:polygon(0 82%,20% 18%,50% 0,82% 20%,100% 82%,58% 57%,40% 57%)}
.e1{left:7px}.e2{right:7px;transform:scaleX(-1)}
.eye{position:absolute;top:86px;width:28px;height:35px;border-radius:50%;background:#121722;box-shadow:inset 6px 5px 0 #fff4;animation:blink 5s infinite}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
.eye1{left:52px}.eye2{right:52px}
.nose{position:absolute;left:94px;top:124px;width:25px;height:18px;border-radius:50% 50% 58% 58%;background:#ef7990}
.mouth{position:absolute;left:91px;top:139px;width:31px;height:18px;border-bottom:3px solid #25202a;border-radius:0 0 50% 50%}
.whisker{position:absolute;width:66px;height:2px;background:#ffffffaa;border-radius:3px;top:137px}.w1{left:-45px;transform:rotate(8deg)}.w2{left:-45px;top:150px;transform:rotate(-7deg)}.w3{right:-45px;transform:rotate(-8deg)}.w4{right:-45px;top:150px;transform:rotate(7deg)}
.paw{position:absolute;top:244px;width:64px;height:48px;border-radius:48% 48% 40% 40%;background:#d98a30;z-index:5}.p1{left:46px}.p2{right:46px}
.leg{position:absolute;top:264px;width:54px;height:58px;border-radius:25px;background:#a95d27}.l1{left:73px}.l2{right:73px}
.tail{position:absolute;right:17px;top:180px;width:110px;height:115px;border:21px solid #b96b2a;border-left-color:transparent;border-bottom-color:transparent;border-radius:50%;transform:rotate(8deg);z-index:-1}
.touchmark{position:absolute;width:42px;height:42px;border:3px solid #fff;border-radius:50%;pointer-events:none;animation:ripple .6s ease-out forwards;z-index:30}
@keyframes ripple{to{transform:scale(2.4);opacity:0}}
.reactbar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.react{background:#fff;border:1px solid var(--line);border-radius:18px;padding:11px 4px;font-weight:900;color:#45506b;box-shadow:0 8px 20px #27304a0b}
.react:active{transform:scale(.96)}
.voice{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:9px}
.big{padding:14px;border-radius:18px;font-weight:950;background:#fff;border:1px solid var(--line);color:#39435f}
.primary{background:linear-gradient(135deg,#735cf5,#9b64ff);color:#fff;border-color:transparent;box-shadow:0 12px 28px #765cf544}
.micstate{text-align:center;color:var(--muted);font-size:13px;font-weight:750;padding:8px}
.chat{margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:21px;padding:10px}
.chatrow{display:flex;gap:8px}.chat input{flex:1;border:1px solid #e4e6ef;border-radius:15px;padding:13px;outline:none;font-size:15px}.send{width:52px;border-radius:15px;background:#191f38;color:#fff;font-size:20px}
.tiny{font-size:11px;color:#8790a6;text-align:center;margin-top:8px}
</style>
</head>
<body>
<div class="app">
 <header class="top">
  <div class="brand">
   <div class="logo" aria-label="Cat Masti logo">
    <svg viewBox="0 0 100 100" fill="none"><path d="M21 42 17 16l25 15c6-3 10-4 16-4s10 1 16 4l25-15-4 26c4 7 6 14 6 22 0 23-19 34-43 34S15 87 15 64c0-8 2-15 6-22Z" fill="#FFD15C"/><circle cx="37" cy="58" r="5" fill="#171C31"/><circle cx="63" cy="58" r="5" fill="#171C31"/><path d="M46 68c3 3 5 3 8 0M50 67v7" stroke="#171C31" stroke-width="4" stroke-linecap="round"/><path d="M28 70 10 67M28 76 10 78M72 70l18-3M72 76l18 2" stroke="#171C31" stroke-width="3" stroke-linecap="round"/></svg>
   </div>
   <div>Cat <span style="color:#ff6fa8">Masti</span></div>
  </div>
  <div class="live">
   <button class="mini on" id="voiceOn">🔊</button>
   <button class="mini" id="repeatOn">🔁</button>
  </div>
 </header>

 <main class="hero">
  <div class="status"><div class="bubble" id="bubble">म्याऊ! मुझे touch करो 😺</div></div>
  <div class="stage" id="stage">
   <div class="cloud"></div><div class="sun">☀️</div>
   <div class="cat" id="cat">
    <div class="tail"></div><div class="leg l1"></div><div class="leg l2"></div>
    <div class="body"><div class="belly"></div></div>
    <div class="head">
     <div class="ear e1"></div><div class="ear e2"></div>
     <div class="eye eye1"></div><div class="eye eye2"></div>
     <div class="nose"></div><div class="mouth"></div>
     <div class="whisker w1"></div><div class="whisker w2"></div><div class="whisker w3"></div><div class="whisker w4"></div>
    </div>
    <div class="paw p1"></div><div class="paw p2"></div>
   </div>
  </div>

  <div class="reactbar">
   <button class="react" data-react="tickle">😂 गुदगुदी</button>
   <button class="react" data-react="pet">💖 प्यार</button>
   <button class="react" data-react="food">🍗 खाना</button>
   <button class="react" data-react="play">🧶 खेलो</button>
  </div>

  <div class="voice">
   <button class="big primary" id="speak">🎙️ बोलो</button>
   <button class="big" id="voiceMode">🐱 Cute Voice</button>
  </div>
  <div class="micstate" id="micstate">Voice ON • Cat तैयार है</div>

  <div class="chat">
   <div class="chatrow">
    <input id="text" placeholder="कुछ भी लिखें… जैसे: तुम क्या कर रही हो?" autocomplete="off">
    <button class="send" id="send">➤</button>
   </div>
  </div>
  <div class="tiny">यह एक browser-based prototype है। Voice recognition/TTS आपके फोन के browser पर निर्भर करता है।</div>
 </main>
</div>

<script>
(()=>{"use strict";
const $=id=>document.getElementById(id);
let voice=true,repeat=false,voiceMode=0, listening=false, recognition=null;
const voices=["🐱 Cute Voice","👧 Baby Girl","👦 Baby Boy"];
const answers=[
 {re:/hello|हेलो|हैलो|नमस्ते/i,a:["हेलो! म्याऊँ 😺 मैं यहाँ हूँ!","हेलो दोस्त! मुझे बहुत खुशी हुई कि तुम आए। 🐾"]},
 {re:/क्या कर|कर रही|कर रहे/i,a:["मैं तुम्हारे साथ मस्ती कर रही हूँ! 😺","मैं अभी तुम्हारी बात सुन रही हूँ और अपनी पूँछ हिला रही हूँ। 🐾"]},
 {re:/नाम|कौन हो/i,a:["मेरा नाम Cat Masti है! 🐱","मैं Cat Masti हूँ, तुम्हारी प्यारी virtual cat दोस्त। 💖"]},
 {re:/खाना|भूख|खिलाओ/i,a:["म्याऊँ! मुझे थोड़ी भूख लगी है। 🍗 कुछ tasty खिलाओ ना!","वाह! खाना सुनते ही मुझे भूख लग गई। 😋"]},
 {re:/सो|नींद|सुला/i,a:["मुझे थोड़ी नींद आ रही है… 😴","अगर तुम प्यार से सुलाओगे तो मैं आराम करूँगी। 🌙"]},
 {re:/प्यार|लव|पसंद/i,a:["म्याऊँ… मुझे प्यार अच्छा लगता है। 💖","तुम बहुत प्यारे हो! 🐾"]},
 {re:/खेल|झूला|मस्ती/i,a:["चलो खेलते हैं! 🧶","याय! मस्ती का समय! 😺✨"]},
 {re:/कैसी|कैसा|कैसे हो/i,a:["मैं एकदम मज़े में हूँ! तुम कैसे हो? 😺","मैं खुश हूँ और तुम्हारी आवाज़ सुनकर और खुश हो गई। 💖"]},
 {re:/धन्यवाद|थैंक|शुक्रिया/i,a:["म्याऊँ! Welcome दोस्त। 🐾","तुम्हारा स्वागत है! 😺"]},
];
const touchReplies={
 head:["अरे! मेरे सिर पर प्यार से हाथ फेरो। 😽","मुझे सिर पर touch अच्छा लगता है! 🐾"],
 ear:["ओहो! मेरे कान में गुदगुदी हो रही है! 😂","हाय! कान धीरे से छुओ ना! 😺"],
 face:["हाय मेरी नाक! 😹 गुदगुदी मत करो!","मेरी मूँछें हिल रही हैं! 🐱"],
 belly:["अरे मेरे पेट में गुदगुदी! 😂","हाय! tummy tickle हो रही है! 😹"],
 paw:["मेरे पंजे! धीरे से छुओ ना। 🐾","पंजा पकड़ लिया! म्याऊँ! 😺"],
 body:["मुझे प्यार से सहलाओ ना। 💖","वाह, कितना अच्छा touch है! 😽"]
};
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function setBubble(t){$("bubble").textContent=t}
function speak(t){
 if(!voice||!("speechSynthesis"in window))return;
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(t);
 const list=speechSynthesis.getVoices();
 let v=list.find(x=>/^hi-IN$/i.test(x.lang))||list.find(x=>/^hi/i.test(x.lang));
 if(v)u.voice=v;
 u.lang=v?.lang||"hi-IN";
 u.rate=voiceMode===0?1.02:voiceMode===1?1.04:1.0;
 u.pitch=voiceMode===0?1.75:voiceMode===1?1.5:1.12;
 u.volume=1;
 speechSynthesis.speak(u);
}
function react(t,doSpeak=true){setBubble(t);if(doSpeak)speak(t)}
function answer(text){
 text=text.trim(); if(!text)return;
 let hit=answers.find(x=>x.re.test(text));
 let t=hit?pick(hit.a):pick([
  "म्याऊँ! मैंने सुना। थोड़ा और बताओ, मैं तुम्हारे साथ हूँ। 🐱",
  "ओह! यह interesting है। 😺 फिर से बोलो ना!",
  "हम्म… मैं सुन रही हूँ। 🐾 तुम आगे बोलो।",
  "म्याऊँ! मुझे तुम्हारी बात अच्छी लगी। 💖"
 ]);
 react(t,true);
}
function mark(ev){
 const r=$("stage").getBoundingClientRect(),m=document.createElement("div");
 m.className="touchmark";m.style.left=(ev.clientX-r.left)+"px";m.style.top=(ev.clientY-r.top)+"px";$("stage").appendChild(m);setTimeout(()=>m.remove(),650);
}
function touchType(ev){
 const r=$("cat").getBoundingClientRect(),x=(ev.clientX-r.left)/r.width,y=(ev.clientY-r.top)/r.height;
 let k=y<.30?"ear":y<.50?"head":y<.67?"face":y<.84?"belly":y>.84?"paw":"body";
 react(pick(touchReplies[k]),true);mark(ev);
}
$("cat").addEventListener("pointerdown",touchType);
document.querySelectorAll("[data-react]").forEach(b=>b.onclick=()=>{
 const k=b.dataset.react;
 const t=k==="tickle"?"हाय! गुदगुदी मत करो, मैं हँस-हँसकर पागल हो जाऊँगी! 😂🐱":
 k==="pet"?"म्याऊँ… मुझे प्यार मिल रहा है। 😽💖":
 k==="food"?"यम्मी! मुझे खाना चाहिए, कुछ tasty खिलाओ ना! 🍗":
 "याय! चलो खेलते हैं! 🧶🐾";
 react(t,true)
});
$("voiceOn").onclick=()=>{voice=!voice;$("voiceOn").classList.toggle("on",voice);$("micstate").textContent=voice?"Voice ON • Cat तैयार है":"Voice OFF • Silent mode";if(voice)react("म्याऊँ! Voice ON है 😺",true)};
$("repeatOn").onclick=()=>{repeat=!repeat;$("repeatOn").classList.toggle("on",repeat);$("micstate").textContent=repeat?"Repeat ON • आपकी बात दोहराऊँगी":"Repeat OFF • Normal replies";};
$("voiceMode").onclick=()=>{voiceMode=(voiceMode+1)%3;$("voiceMode").textContent=voices[voiceMode];react(voiceMode===0?"Cute Cat voice ON 😺":voiceMode===1?"Baby Girl voice ON 👧":"Baby Boy voice ON 👦",true)};
$("send").onclick=()=>{const t=$("text").value;answer(t);$("text").value=""};
$("text").addEventListener("keydown",e=>{if(e.key==="Enter")$("send").click()});
$("speak").onclick=()=>{
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){$("micstate").textContent="इस browser में microphone recognition उपलब्ध नहीं है। Text box इस्तेमाल करें।";return}
 if(listening){try{recognition.stop()}catch(e){}return}
 recognition=new SR();recognition.lang="hi-IN";recognition.interimResults=false;recognition.continuous=false;recognition.maxAlternatives=1;
 listening=true;$("speak").textContent="👂 सुन रही हूँ…";$("micstate").textContent="बोलिए…";
 recognition.onresult=e=>{
  const t=e.results[0][0].transcript||"";
  if(repeat){setBubble("आप: “"+t+"”");speak(t)}
  else answer(t);
 };
 recognition.onerror=e=>{$("micstate").textContent=e.error==="not-allowed"?"Microphone permission Allow करें।":"आवाज़ साफ नहीं मिली, फिर कोशिश करें।"};
 recognition.onend=()=>{listening=false;$("speak").textContent="🎙️ बोलो";if(repeat)$("micstate").textContent="Repeat ON • फिर बोलने के लिए बोलो दबाएँ";};
 try{recognition.start()}catch(e){listening=false;$("speak").textContent="🎙️ बोलो"}
};
if("speechSynthesis"in window)speechSynthesis.onvoiceschanged=()=>{};
})();
</script>
</body>
</html>'''
